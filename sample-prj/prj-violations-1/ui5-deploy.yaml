# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: de.itsfullofstars.gr.test.viol.prjviolations1
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: MY_ABAP_SYSTEM
        app:
          name: ZVIOLATIONS1
          description: BlueprintAudit violation fixture
          package: ZTEST
          transport: REPLACE_WITH_TRANSPORT
        exclude:
          - /test/
          - /localService/
