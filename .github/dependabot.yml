version: 2
updates:
  # Root npm workspace: devDependencies in package.json plus packages/* (workspaces)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      workspace-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@types/node"
    # typescript-eslint doesn't support TypeScript 7.x yet (TS skipped 6.x for
    # the native Go compiler rewrite), so a major bump here breaks lint/typecheck.
    # Keep on 5.x/minor updates until typescript-eslint catches up, then remove.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Standalone sample projects used as rule-validation fixtures (not npm workspaces)
  - package-ecosystem: npm
    directories:
      - "/sample-prj/*"
    schedule:
      interval: weekly
    groups:
      sample-project-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    # TypeScript 7.x removes moduleResolution=node10 and baseUrl, which
    # ui5-tooling-transpile's TS templates still rely on (breaks `tsc --noEmit`
    # in these fixtures even though CI itself never installs/builds them here).
    # Keep on 5.x/minor updates until the UI5 TS tooling catches up, then remove.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep pinned GitHub Actions SHAs in CI workflows up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
