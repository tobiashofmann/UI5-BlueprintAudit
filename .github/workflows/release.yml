name: Release

on:
  push:
    branches: [main]
    paths:
      - "packages/ui5-blueprint-audit/package.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-version:
    # Guards the whole pipeline: workflow_dispatch can run this workflow from any ref
    # that has the file, not just main. Without this, a manual dispatch from a branch
    # would still reach publish-and-release (needs: cascades skip, but better explicit).
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: github.event.before can point further back than one commit
          # whenever a push lands more than one new commit on main at once (squash
          # merge, rebase merge, or a direct multi-commit push) - HEAD^ alone would
          # only look at the second-to-last of those commits, not the true pre-push
          # state of main.
          fetch-depth: 0
          persist-credentials: false

      - name: Compare version against previous commit
        id: diff
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          CURRENT=$(node -p "require('./packages/ui5-blueprint-audit/package.json').version")

          # github.event.before is the main ref's SHA before this entire push (correct
          # regardless of how many commits it contains). It's unset/absent on
          # workflow_dispatch and is all-zeros for a branch's first-ever push - fall
          # back to HEAD^ (the immediate parent) in both cases.
          BASE="$EVENT_BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD^"
          fi

          if git cat-file -e "$BASE:packages/ui5-blueprint-audit/package.json" 2>/dev/null; then
            git show "$BASE:packages/ui5-blueprint-audit/package.json" > /tmp/previous-package.json
            PREVIOUS=$(node -p "require('/tmp/previous-package.json').version")
          else
            PREVIOUS=""
          fi
          echo "Current version: $CURRENT (previous: ${PREVIOUS:-none}, base: $BASE)"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  publish-and-release:
    needs: [check-version, verify]
    # Defense in depth on top of check-version's gate: this job holds the npm OIDC and
    # release credentials, so it must never run off a ref other than protected main.
    # An explicit `if` replaces the implicit success()-of-needs check GitHub Actions
    # would otherwise apply, so success() must be spelled out here too.
    if: success() && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 bundles npm >=11.5.1, required for Trusted Publishing (OIDC);
          # avoids running an unpinned `npm install -g` in this credentialed job.
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish packages to npm
        run: |
          publish_if_needed() {
            local workspace="$1"
            local pkg_json="$2"
            local name version
            name=$(node -p "require('./$pkg_json').name")
            version=$(node -p "require('./$pkg_json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              echo "Publishing $name@$version"
              npm publish --workspace "$workspace" --provenance
            fi
          }
          publish_if_needed "@abap/ui5-blueprint-audit-types" "packages/ui5-blueprint-audit-types/package.json"
          publish_if_needed "@abap/ui5-blueprint-audit-plugin-core" "packages/ui5-blueprint-audit-plugin-core/package.json"
          publish_if_needed "@abap/ui5-blueprint-audit" "packages/ui5-blueprint-audit/package.json"

      - name: Generate SBOMs
        run: npm run sbom

      - name: Flatten SBOMs for release assets
        # GitHub release assets share one flat namespace, but sbom/ nests
        # <project>/<variant>.cdx.json - flatten to <project>-<variant>.cdx.json.
        run: |
          mkdir -p sbom-release
          for project_dir in sbom/*/; do
            project=$(basename "$project_dir")
            for file in "$project_dir"*.cdx.json; do
              variant=$(basename "$file" .cdx.json)
              cp "$file" "sbom-release/${project}-${variant}.cdx.json"
            done
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: sbom-release/*.cdx.json
