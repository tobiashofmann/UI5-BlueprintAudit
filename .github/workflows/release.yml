name: Release

on:
  push:
    branches: [main]
    paths:
      - "packages/ui5-blueprint-audit/package.json"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Compare version against previous commit
        id: diff
        shell: bash
        run: |
          CURRENT=$(node -p "require('./packages/ui5-blueprint-audit/package.json').version")
          if git cat-file -e 'HEAD^:packages/ui5-blueprint-audit/package.json' 2>/dev/null; then
            git show 'HEAD^:packages/ui5-blueprint-audit/package.json' > /tmp/previous-package.json
            PREVIOUS=$(node -p "require('/tmp/previous-package.json').version")
          else
            PREVIOUS=""
          fi
          echo "Current version: $CURRENT (previous: ${PREVIOUS:-none})"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-and-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (trusted publishing requires npm >=11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Publish packages to npm
        run: |
          publish_if_needed() {
            local workspace="$1"
            local pkg_json="$2"
            local name version
            name=$(node -p "require('$pkg_json').name")
            version=$(node -p "require('$pkg_json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              echo "Publishing $name@$version"
              npm publish --workspace "$workspace" --provenance
            fi
          }
          publish_if_needed "@abap/ui5-blueprint-audit-types" "packages/ui5-blueprint-audit-types/package.json"
          publish_if_needed "@abap/ui5-blueprint-audit-plugin-core" "packages/ui5-blueprint-audit-plugin-core/package.json"
          publish_if_needed "@abap/ui5-blueprint-audit" "packages/ui5-blueprint-audit/package.json"

      - name: Create GitHub release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
